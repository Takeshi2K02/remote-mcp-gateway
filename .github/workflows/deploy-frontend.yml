# ──────────────────────────────────────────────────────────────────────────────
# Deploy Frontend – Azure App Service (mcp-gateway-frontend)
#
# Triggers on every push to `main`, but ONLY when files inside frontend/ change.
# Authentication uses a PUBLISH PROFILE secret (AZURE_FRONTEND_PUBLISH_PROFILE),
# not OIDC — see the note on the deploy step.
# No upload-artifact / download-artifact used — no GitHub artifact storage quota.
#
# WHY THIS BUILDS ON THE RUNNER (and the backend does not):
#   The backend lets Oryx build server-side, because `pip install` is cheap.
#   The frontend cannot. On the shared B1 plan (1 core, 1.75 GB RAM) a
#   server-side `next build` took ~12 minutes and then died — not in the build
#   itself, which succeeded (compiled in 71s, TypeScript in 52s, all 14 routes
#   generated), but in Oryx's post-build "Zipping existing node_modules
#   folder..." step, which stopped writing log output and was marked failed.
#   That is a memory ceiling, not something a longer timeout fixes.
#
#   So the build moves to the runner, which has the resources for it, and
#   App Service receives finished output. SCM_DO_BUILD_DURING_DEPLOYMENT must
#   be FALSE on the web app for this to work — that is true under OneDeploy
#   too, which honours the setting exactly as `az webapp deploy` does. See the
#   note on the deploy step.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Frontend to Azure App Service

# ── Trigger ───────────────────────────────────────────────────────────────────
# Fires automatically on pushes to main when frontend/ files OR this workflow
# file itself changes. The workflow file path is included so that edits to
# the CI config re-deploy without requiring a separate frontend/ change to
# satisfy the filter.
#
# workflow_dispatch lets you kick off a manual run from the GitHub Actions UI
# without pushing any code — useful when only this file changes, or to force a
# clean re-deploy. It is also how you rebuild after changing the API base URL
# below, since that value is compiled into the bundle rather than read at
# runtime.
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

# ── Concurrency ───────────────────────────────────────────────────────────────
# If a new push arrives while a deploy is still running for the same branch,
# cancel the older run instead of queuing it behind the new one.
# This avoids piling up run history and prevents stale deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions ───────────────────────────────────────────────────────────────
# `contents: read` is the minimum needed to check out the repository.
# `id-token: write` is deliberately GONE: the publish profile carries its own
# credentials, so there is no OIDC token exchange to authorize.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out source code ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node ─────────────────────────────────────────────────────
      # Node 22 to match the App Service runtime (NODE|22-lts). This is
      # load-bearing rather than cosmetic: the bundle shipped to Azure is
      # produced HERE, so a version skew between runner and App Service would
      # mean running artifacts built by a different Node than serves them.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── 3. Install dependencies ────────────────────────────────────────────
      # `npm ci` (not `npm install`) installs exactly what's in
      # package-lock.json and never modifies it — the reproducible choice for
      # CI. Blocking on purpose: a corrupted lockfile must fail the run rather
      # than be swallowed by the lint step's tolerance below.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # ── 4. Lint ────────────────────────────────────────────────────────────
      # TEMPORARY: continue-on-error is set because the app carries 27
      # pre-existing ESLint errors (@typescript-eslint/no-unused-vars,
      # react/no-unescaped-entities, react-hooks/set-state-in-effect and
      # others) that predate this deployment work and are unrelated to it.
      # Leaving the gate blocking would red-line every deploy for reasons that
      # have nothing to do with whether the deploy is sound. The step still
      # runs and its output stays in the run log.
      #
      # Remove continue-on-error once those 27 errors are fixed separately, so
      # lint goes back to being a real pre-deploy gate.
      - name: Lint
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      # ── 5. Build ───────────────────────────────────────────────────────────
      # This is the build that ships. There is no second build later with
      # different inputs — what is produced here is exactly what App Service
      # serves.
      #
      # NEXT_PUBLIC_API_BASE_URL is compiled into the client JS bundle by
      # Next at build time; it is NOT read at runtime. Because the build
      # happens on this runner, the value belongs here as a step env var. It
      # used to have to live in App Settings purely because Oryx built
      # server-side and could only see the environment Azure gave it.
      #
      # Consequences worth knowing: changing this URL requires re-running this
      # workflow (a restart or an App Setting edit will do nothing), and
      # lib/config/env.ts throws when the variable is missing, so a typo here
      # fails the build loudly rather than shipping a broken bundle.
      #
      # Note this is a BLOCKING step. A build failure must stop the deploy —
      # otherwise we would ship the previous build's stale output.
      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: 'https://mcp-gateway-backend-ezfydqhagdghced2.southeastasia-01.azurewebsites.net'
        run: npm run build

      # ── 6. Drop devDependencies ────────────────────────────────────────────
      # Kept because it is harmless and keeps the runner tree honest, but note
      # it no longer affects the deploy payload: with standalone output the
      # package is built from .next/standalone, which carries its own traced
      # node_modules and is unaffected by pruning the root one.
      - name: Prune devDependencies
        working-directory: frontend
        run: |
          echo "Root node_modules before prune:"
          du -sh node_modules
          npm prune --omit=dev
          echo "Root node_modules after prune:"
          du -sh node_modules

      # ── 7. Assemble the standalone deploy tree ─────────────────────────────
      # `output: "standalone"` emits .next/standalone containing server.js,
      # package.json and a node_modules holding only what Next traced as
      # reachable at runtime. It deliberately does NOT include .next/static or
      # public/, so both are copied in at the paths server.js expects.
      #
      # This is what shrinks the package. Measured: the previous whole-repo
      # approach produced a 196 MB zip that Kudu rejected with HTTP_502; the
      # standalone tree is ~38 MB and zips to ~12 MB.
      - name: Assemble standalone output
        working-directory: frontend
        run: |
          echo "── sizes before assembly ──"
          du -sh node_modules .next .next/standalone .next/static public 2>/dev/null || true

          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public

          echo "── assembled deploy tree ──"
          du -sh .next/standalone
          ls -a .next/standalone

      # ── 8. Zip the standalone tree ─────────────────────────────────────────
      # Zips the CONTENTS of .next/standalone, so server.js lands at the root
      # of /home/site/wwwroot. The App Service startup command must be
      # `node server.js` to match — `next start` does not run standalone
      # output.
      #
      # The zip is built explicitly rather than handing the directory to
      # azure/webapps-deploy and letting the action zip it, so the archive
      # layout (and its size, which is logged) is exactly what we control and
      # have already verified.
      - name: Zip standalone output
        working-directory: frontend/.next/standalone
        run: |
          zip -r -q "$RUNNER_TEMP/frontend-deploy.zip" .
          echo "Deploy package size:"
          du -sh "$RUNNER_TEMP/frontend-deploy.zip"

      # ── 9. Deploy via publish profile ──────────────────────────────────────
      # azure/webapps-deploy@v3 authenticates with the publish profile in
      # AZURE_FRONTEND_PUBLISH_PROFILE — no azure/login, no service principal,
      # no OIDC federated credential. Paste the whole XML from
      # Azure Portal → mcp-gateway-frontend → Download publish profile into
      # that repo secret.
      #
      # REQUIREMENT: SCM basic auth publishing must be ENABLED on the web app.
      # A publish profile is a basic-auth credential, so with
      # basicPublishingCredentialsPolicies/scm set to allow:false the deploy
      # fails 401/403 no matter how correct this file is:
      #   az resource update -g rg-mcp-gateway --namespace Microsoft.Web \
      #     --resource-type basicPublishingCredentialsPolicies --name scm \
      #     --parent sites/mcp-gateway-frontend --set properties.allow=true
      #
      # REQUIREMENT: SCM_DO_BUILD_DURING_DEPLOYMENT must be FALSE on the web
      # app. This action deploys through OneDeploy (Kudu's /api/publish), and
      # OneDeploy DOES honour that setting — an earlier version of this comment
      # claimed it did not, which was wrong. Per Microsoft's deploy-zip doc:
      # "By default, the deployment engine assumes that a ZIP package is ready
      # to run as-is and doesn't run any build automation. To enable the same
      # build automation used in a Git deployment, set the
      # SCM_DO_BUILD_DURING_DEPLOYMENT app setting."
      #
      # With it TRUE, Oryx runs `npm install` + `next build` against
      # .next/standalone, which has no app/ or pages/ — it is already-built
      # runtime output — and the deploy fails. Leave it false and OneDeploy
      # extracts the package as-is, which is what we want.
      #
      # (Contrast the backend workflow, which must keep using
      # `az webapp deploy --type zip` with the setting TRUE, precisely BECAUSE
      # it needs Oryx to run pip install server-side.)
      #
      # Deploying content does not touch siteConfig — the startup command,
      # app settings and runtime stack set out-of-band all survive a deploy.
      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: mcp-gateway-frontend
          publish-profile: ${{ secrets.AZURE_FRONTEND_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/frontend-deploy.zip

      # ── 10. Verify the site actually came up ───────────────────────────────
      # The hostname comes from the deploy step's own `webapp-url` output, so
      # the generated *.azurewebsites.net suffix can never drift out of sync
      # with this file. Previously this was read back with `az webapp show`,
      # which is no longer available — there is no Azure CLI session in this
      # job anymore.
      #
      # A status code alone is NOT a sufficient signal. An App Service with
      # nothing deployed serves a default "your web app is running and waiting
      # for your content" placeholder that returns HTTP 200 — so a status-only
      # check reports success for a site running none of our code. That false
      # positive already happened on this workflow once.
      #
      # So the body is checked for "/_next/", the path prefix Next.js emits for
      # every build asset. Verified against a local run of this exact
      # standalone server: the served page contains it. Redirects are followed
      # (-L) because / may redirect to /login depending on auth state.
      - name: Health check
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          URL="${WEBAPP_URL:-https://mcp-gateway-frontend-dqfbbwasapedeyah.southeastasia-01.azurewebsites.net}"
          URL="${URL%/}/"
          echo "Polling ${URL}"

          for i in $(seq 1 40); do
            CODE=$(curl -sL -o /tmp/index.html -w '%{http_code}' --max-time 30 "$URL" || echo 000)

            if [ "$CODE" = "200" ] && grep -q '/_next/' /tmp/index.html; then
              echo "Healthy after ${i} attempt(s): HTTP ${CODE}, Next.js assets present."
              exit 0
            fi

            if [ "$CODE" = "200" ]; then
              # Responding, but not with our app — the App Service placeholder,
              # or the startup command is not `node server.js`.
              echo "Attempt ${i}/40: HTTP 200 but no /_next/ marker — not our app yet."
            else
              echo "Attempt ${i}/40: HTTP ${CODE}"
            fi
            sleep 15
          done

          echo "::error::${URL} did not serve Next.js output within 10 minutes."
          echo "Last response was HTTP ${CODE}. First 500 bytes of body:"
          head -c 500 /tmp/index.html || true
          exit 1
