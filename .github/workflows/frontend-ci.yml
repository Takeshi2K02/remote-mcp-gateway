# CI for the frontend (Next.js) service only.
#
# Same "paths" idea as backend-ci.yml, mirrored for frontend/: this workflow
# only triggers on commits touching frontend/ (or this file), so a
# backend-only change never runs it.
name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

jobs:
  frontend-test:
    name: Frontend lint & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # actions/setup-node's built-in cache option caches npm's download
      # cache (~/.npm) keyed on package-lock.json, so `npm ci` is fast on
      # repeat runs instead of re-downloading every package from the
      # registry each time.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) installs exactly what's in
      # package-lock.json and never modifies it - the standard choice for
      # CI, where you want a reproducible install rather than a resolver
      # possibly picking up newer versions than what's committed.
      - name: Install dependencies
        run: npm ci

      # There is no test framework in this project yet (no Jest/Vitest/etc.
      # in package.json) - lint + a production build are the only
      # verification available today. This currently fails: the app has 27
      # pre-existing ESLint errors (unrelated to this CI setup) across
      # @typescript-eslint/no-unused-vars, react/no-unescaped-entities,
      # react-hooks/set-state-in-effect, and a few others. Per your call,
      # we're wiring this in as a real blocking gate now rather than hiding
      # it, so the first run on this file is expected to go red until those
      # are fixed in a follow-up.
      - name: Lint
        run: npm run lint

      # next build fails immediately if NEXT_PUBLIC_API_BASE_URL isn't set
      # (no fallback - lib/config/env.ts throws), because it's a
      # NEXT_PUBLIC_* variable that gets baked into the client JS bundle at
      # build time. This build is only a correctness check ("does the app
      # still compile") - it isn't the artifact that gets deployed, so the
      # placeholder value below never needs to be a real backend URL. The
      # actual production value gets passed as a Docker build-arg in the
      # build-and-push-frontend job we'll add in Step 2.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: "https://ci-placeholder.invalid"

  # Builds the frontend image and pushes it to Azure Container Registry.
  # Only runs on a push to main (never on PRs) - same as
  # build-and-push-backend.
  build-and-push-frontend:
    name: Build & push frontend image
    needs: frontend-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      REGISTRY: rmgwregistry.azurecr.io
      IMAGE_NAME: mcp-gateway-frontend
      # NEXT_PUBLIC_API_BASE_URL is inlined into the client JS bundle at
      # build time (see frontend/Dockerfile) - it is baked into the image,
      # not read at container startup. If this URL ever changes, the image
      # must be rebuilt; a Container App env var change alone would have
      # no effect on already-built JS.
      NEXT_PUBLIC_API_BASE_URL: "https://mcp-gateway-backend.gentleforest-38e3a42b.southeastasia.azurecontainerapps.io"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.REGISTRY }}

      - name: Build and push image
        working-directory: frontend
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          docker build \
            --build-arg NEXT_PUBLIC_API_BASE_URL="${{ env.NEXT_PUBLIC_API_BASE_URL }}" \
            -t "$IMAGE:$SHORT_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHORT_SHA"
          docker push "$IMAGE:latest"

  # Points the existing Container App at the image just pushed above. Same
  # pattern as deploy-backend: Single revision mode means the new revision
  # takes 100% traffic as soon as it's healthy, no separate traffic-split
  # step. Only --image is passed, so existing env vars/secrets/scale rules
  # are left untouched.
  deploy-frontend:
    name: Deploy frontend to Container Apps
    needs: build-and-push-frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      REGISTRY: rmgwregistry.azurecr.io
      IMAGE_NAME: mcp-gateway-frontend
      CONTAINER_APP_NAME: mcp-gateway-frontend
      RESOURCE_GROUP: rg-remote-mcp-gateway-dev

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy new image to Container App
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHORT_SHA
