# ──────────────────────────────────────────────────────────────────────────────
# Deploy Backend – Azure App Service (mcp-gateway-backend)
#
# Triggers on every push to `main`, but ONLY when files inside backend/ change.
# Authentication uses OIDC federated identity (no secrets stored in the repo).
# Deploys via `az webapp deploy --type zip` (Kudu ZIP deploy), which triggers
# Oryx's server-side build (pip install) when SCM_DO_BUILD_DURING_DEPLOYMENT=true.
# No upload-artifact / download-artifact used — no GitHub artifact storage quota.
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Backend to Azure App Service

# ── Trigger ───────────────────────────────────────────────────────────────────
# Fires automatically on pushes to main when backend/ files OR this workflow
# file itself changes. The workflow file path is included so that edits to
# the CI config (e.g. adding a step, changing the resource group) re-deploy
# without requiring a separate backend/ change to satisfy the filter.
#
# workflow_dispatch lets you kick off a manual run from the GitHub Actions UI
# without pushing any code — useful when only this file changes (path filter
# changes don't self-trigger the commit that introduces them) or when you
# want to force a clean re-deploy on demand.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

# ── Concurrency ───────────────────────────────────────────────────────────────
# If a new push arrives while a deploy is still running for the same branch,
# cancel the older run instead of queuing it behind the new one.
# This avoids piling up run history and prevents stale deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions ───────────────────────────────────────────────────────────────
# `id-token: write` is required for OIDC token exchange with Azure.
# `contents: read` is the minimum needed to check out the repository.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out source code ────────────────────────────────────────────
      # Fetches the repository so subsequent steps can access the files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Authenticate to Azure via OIDC ──────────────────────────────────
      # Uses federated identity (OIDC) – no client secret or publish profile is
      # stored in this repo. The three secret values below must be added in
      # GitHub → Settings → Secrets and variables → Actions for this repository.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 3. Zip backend/ and deploy via az webapp deploy ────────────────────
      # WHY az webapp deploy instead of azure/webapps-deploy@v3:
      #   azure/webapps-deploy@v3 uses OneDeploy under the hood. OneDeploy
      #   bypasses the Kudu SCM site entirely and deploys straight to /home/site
      #   /wwwroot, which means SCM_DO_BUILD_DURING_DEPLOYMENT=true is ignored —
      #   Oryx never runs, requirements.txt is never pip-installed, and the app
      #   crashes with ModuleNotFoundError (uvicorn, fastapi, etc. not found).
      #
      #   `az webapp deploy --type zip` pushes through the Kudu ZIP deploy
      #   endpoint (/api/zipdeploy). Kudu reads SCM_DO_BUILD_DURING_DEPLOYMENT
      #   and, when true, hands the zip to Oryx, which runs `pip install -r
      #   requirements.txt` into the antenv virtual environment that App
      #   Service's Python launcher activates at startup. This is the correct
      #   and supported path for SCM-based builds on App Service Linux.
      #
      # No pre-installed packages are shipped in the zip — Oryx owns that step.
      # No upload-artifact / download-artifact are used anywhere in this job.
      #
      # WHY --track-status false:
      #   `az webapp deploy` does two separate waits on Linux web apps:
      #     1. Poll Kudu until the deployment (including Oryx's pip install)
      #        finishes. This is the wait we WANT — it surfaces real build
      #        failures such as a broken requirements.txt.
      #     2. Poll the site's runtime startup status for up to ~10 minutes and
      #        fail with "Deployment failed because the site failed to start
      #        within 10 mins" if its own health probe hasn't gone green yet.
      #   Wait (2) is what has been failing this workflow. The app in fact boots
      #   fine — Log Stream shows every gunicorn worker up and "Application
      #   startup complete" — the CLI's probe is simply stricter and slower to
      #   observe it than the app is to start. `--track-status false` disables
      #   ONLY wait (2); the Kudu/Oryx wait is untouched, so a genuine build
      #   failure still fails this step.
      #
      #   Deliberately NOT using --async / --no-wait: those return as soon as
      #   the zip has been pushed, before Oryx runs at all, which would turn a
      #   failed pip install into a green deploy. The readiness signal we lose
      #   from (2) is replaced by the explicit health-check step below, which
      #   polls a real endpoint we control.
      - name: Zip and deploy backend to Azure App Service
        run: |
          # Create a zip of the backend/ folder contents (not the folder itself,
          # so that requirements.txt is at the root of the zip as Oryx expects).
          cd backend
          zip -r ../backend-deploy.zip . --exclude '*.pyc' --exclude '__pycache__/*' \
            --exclude '.venv/*' --exclude '.env' --exclude '.pytest_cache/*' \
            --exclude '.benchmarks/*'
          cd ..

          # Deploy via Kudu ZIP endpoint — this is what respects
          # SCM_DO_BUILD_DURING_DEPLOYMENT and triggers Oryx's pip install.
          # --timeout is the Kudu-side budget (15 min) for that pip install;
          # it is unrelated to the runtime startup probe disabled above.
          az webapp deploy \
            --resource-group rg-mcp-gateway \
            --name mcp-gateway-backend \
            --src-path backend-deploy.zip \
            --type zip \
            --track-status false \
            --timeout 900000

      # ── 4. Verify the site actually came up ────────────────────────────────
      # Replaces the CLI's built-in startup polling that was removed above.
      # /health is deliberately the target rather than /docs: it is a plain
      # in-process handler that touches no database, so it answers as soon as
      # gunicorn is serving and cannot be held up by a cold Azure SQL
      # connection. The hostname is read back from the web app rather than
      # hardcoded, so the generated *.azurewebsites.net suffix can never drift
      # out of sync with this file.
      - name: Health check
        run: |
          HOST=$(az webapp show \
            --resource-group rg-mcp-gateway \
            --name mcp-gateway-backend \
            --query defaultHostName -o tsv)
          URL="https://${HOST}/health"
          echo "Polling ${URL}"

          # 40 attempts, 15s apart — a 10 minute budget, matching the window
          # the old built-in probe allowed, but measured against an endpoint
          # whose semantics we own.
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /tmp/health.txt -w '%{http_code}' --max-time 30 "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${i} attempt(s): $(cat /tmp/health.txt)"
              exit 0
            fi
            echo "Attempt ${i}/40: HTTP ${CODE} — retrying in 15s"
            sleep 15
          done

          echo "::error::Site did not return HTTP 200 from ${URL} within 10 minutes."
          echo "Last response body:"
          cat /tmp/health.txt || true
          exit 1
