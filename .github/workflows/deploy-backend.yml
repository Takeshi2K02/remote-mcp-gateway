# ──────────────────────────────────────────────────────────────────────────────
# Deploy Backend – Azure App Service (mcp-gateway-backend)
#
# Triggers on every push to `main`, but ONLY when files inside backend/ change.
# Authentication uses OIDC federated identity (no secrets stored in the repo).
# Build and deploy happen in a single job on the same runner to avoid consuming
# GitHub artifact storage quota (no upload-artifact / download-artifact used).
# ──────────────────────────────────────────────────────────────────────────────

name: Deploy Backend to Azure App Service

# ── Trigger ───────────────────────────────────────────────────────────────────
# Run on pushes to main, but only when backend/ files change.
# This prevents the workflow from firing when only frontend/ (or other) files
# are modified, keeping CI noise and billable minutes to a minimum.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

# ── Concurrency ───────────────────────────────────────────────────────────────
# If a new push arrives while a deploy is still running for the same branch,
# cancel the older run instead of queuing it behind the new one.
# This avoids piling up run history and prevents stale deployments.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions ───────────────────────────────────────────────────────────────
# `id-token: write` is required for OIDC token exchange with Azure.
# `contents: read` is the minimum needed to check out the repository.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      # ── 1. Check out source code ────────────────────────────────────────────
      # Fetches the repository so subsequent steps can access the files.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.12 ──────────────────────────────────────────────
      # Matches the runtime version used in Azure App Service for the backend.
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 3. Authenticate to Azure via OIDC ──────────────────────────────────
      # Uses federated identity (OIDC) – no client secret or publish profile is
      # stored in this repo. The three secret values below must be added in
      # GitHub → Settings → Secrets and variables → Actions for this repository.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── 4. Deploy to Azure App Service ─────────────────────────────────────
      # Zips the backend/ folder and ships it to mcp-gateway-backend.
      # No artifact upload/download is used – the zip is streamed directly
      # from this runner to the App Service deployment endpoint.
      #
      # Dependencies are NOT pre-installed here. The App Service Oryx build
      # system handles `pip install -r requirements.txt` server-side after
      # the zip lands, because SCM_DO_BUILD_DURING_DEPLOYMENT=true is set as
      # an App Setting. This ensures packages are installed into the correct
      # venv that App Service's Python runtime actually uses — installing
      # them client-side to .python_packages/lib/site-packages was the root
      # cause of ModuleNotFoundError at runtime (that path is not on sys.path).
      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: mcp-gateway-backend
          package: './backend'
